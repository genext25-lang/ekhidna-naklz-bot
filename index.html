<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ехидна Наклз — Мафиози</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 30, 35, 0.95);
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(220, 60, 60, 0.3);
            text-align: center;
        }

        .hero-icon {
            font-size: 80px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
            margin-bottom: 8px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e0e0, #ff4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 28px;
            border-bottom: 1px dashed #444;
            display: inline-block;
            padding-bottom: 6px;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn-mode {
            background: #222;
            border: 1px solid #3a3a3a;
            border-radius: 100px;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #eee;
        }

        .btn-mode:active {
            transform: scale(0.97);
            background: #2c2c2c;
            border-color: #ff5555;
        }

        .rps { border-left: 6px solid #ff7777; }
        .match3 { border-left: 6px solid #77aaff; }

        .stats-preview {
            background: #111;
            border-radius: 32px;
            padding: 14px 16px;
            margin: 10px 0 20px;
            font-size: 14px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            border: 1px solid #2a2a2a;
        }

        .footer-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .small-btn {
            background: #1f1f2b;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            color: #dddddd;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s linear;
        }

        .small-btn:active {
            background: #333;
            color: white;
        }

        .info-text {
            margin-top: 24px;
            font-size: 11px;
            color: #5a5a6e;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="hero-icon">🦔</div>
    <h1>ЕХИДНА НАКЛЗ</h1>
    <div class="sub">криминальные разборки</div>

    <div class="stats-preview" id="previewStats">
        <span>📊 загрузка...</span>
    </div>

    <div class="mode-buttons">
        <div class="btn-mode rps" id="rpsBtn">
            🥊🪨📄  ДУЭЛЬ  |  Камень / Ножницы / Бумага
        </div>
        <div class="btn-mode match3" id="match3Btn">
            🎰🧩 РАЗБОРКА  |  Матч-3 (три в ряд)
        </div>
    </div>

    <div class="footer-buttons">
        <div class="small-btn" id="profileBtn">📜 МОЙ ПРОФИЛЬ</div>
        <div class="small-btn" id="roomsBtn">🏟️ КОМНАТЫ</div>
    </div>
    <div class="info-text">
        💎 Сражения на TON • Рейтинговые бои • NFT-награды
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand(); // на весь экран
    tg.enableClosingConfirmation(); // подтверждение при закрытии

    // Элементы интерфейса
    const previewStats = document.getElementById('previewStats');
    const rpsBtn = document.getElementById('rpsBtn');
    const match3Btn = document.getElementById('match3Btn');
    const profileBtn = document.getElementById('profileBtn');
    const roomsBtn = document.getElementById('roomsBtn');

    // Функция загрузки данных пользователя через Telegram WebApp
    function loadUserData() {
        const initData = tg.initDataUnsafe;
        if (initData && initData.user) {
            const user = initData.user;
            previewStats.innerHTML = `
                <span>🆔 ${user.id}</span>
                <span>👤 @${user.username || 'игрок'}</span>
                <span>⭐ ранг 1</span>
            `;
        } else {
            previewStats.innerHTML = `<span>🖤 режим демо</span><span>⚔️ бродяга</span>`;
        }
    }

    // Переход в режим "Дуэль" (RPS)
    rpsBtn.addEventListener('click', () => {
        tg.showPopup({
            title: '🥊 ДУЭЛЬ',
            message: 'Скоро: камень, ножницы, бумага с реальными ставками TON',
            buttons: [{type: 'ok'}]
        });
        // В будущем: tg.openLink('https://t.me/yourbot/game?mode=rps')
    });

    // Переход в режим "Разборка" (Match-3)
    match3Btn.addEventListener('click', () => {
        tg.showPopup({
            title: '🎲 РАЗБОРКА',
            message: 'Скоро: мафиозный три-в-ряд — прокачай Ехидну',
            buttons: [{type: 'ok'}]
        });
    });

    // Показать профиль (вызов команды бота)
    profileBtn.addEventListener('click', () => {
        tg.close(); // Закрываем мини-приложение
        // Перенаправление на бота с командой /profile
        window.location.href = 'https://t.me/ekhidna_naklz_bot?start=profile';
    });

    // Список комнат (заглушка)
    roomsBtn.addEventListener('click', () => {
        tg.showPopup({
            title: '🏟️ КОМНАТЫ',
            message: 'Здесь будут PvP-комнаты со ставками 0.1–5 TON',
            buttons: [{type: 'ok'}]
        });
    });

    // Загрузка данных
    loadUserData();

    // Сообщаем боту, что приложение готово
    tg.ready();
</script>
</body>
</html>
